[server]
adminAddr = ":8080"
apiAddr = ":8081"
ginMode = "release"

[mysql]
# 标准 DSN 一行式：用户名:密码@tcp(地址:端口)/库名?参数
url = "magpie_user:password@tcp(127.0.0.1:3306)/magpie?charset=utf8mb4&parseTime=True&loc=UTC"

[bootstrap]
username = "admin"
password = "change-me"

[session]
ttlHours = 24

[log]
level = "info"
console = true
ginRequest = false

[log.file]
enabled = true
filename = "logs/magpie.log"
maxSizeMb = 100
maxBackups = 10
maxAgeDays = 30
compress = true
