[server]
adminAddr = ":6080"
apiAddr = ":6081"
ginMode = "release"
# 管理控制台的部署子路径，nginx 反代到子路径（如 https://host/magpie/）时设置为 "/magpie"，
# 需与 nginx location 保持一致；根路径部署（https://host/）留空。
webBasePath = ""

[mysql]
# 标准 DSN 一行式：用户名:密码@tcp(地址:端口)/库名?参数
url = "magpie_user:password@tcp(127.0.0.1:3306)/magpie?charset=utf8mb4&parseTime=True&loc=UTC"

[bootstrap]
username = "admin"
password = "change-me"

[session]
ttlHours = 24

[log]
level = "info"
console = true
ginRequest = false

[log.file]
enabled = true
filename = "logs/magpie.log"
maxSizeMb = 100
maxBackups = 10
maxAgeDays = 30
compress = true
