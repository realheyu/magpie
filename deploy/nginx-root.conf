# magpie 管理控制台 —— 线上根路径部署（https://magpie.example.com/）
#
# 后端 config.toml 无需特殊配置（server.webBasePath 留空）。
# 前端页面、/api/admin/* 管理接口均由 magpie 自身提供，nginx 只做入口反代。

# ---------- HTTP：直接反代（还没配证书时用这个 server 即可） ----------
server {
    listen 80;
    server_name magpie.example.com;

    # 注意 proxy_pass 末尾不带路径，请求原样转发给后端
    location / {
        proxy_pass http://127.0.0.1:6030;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 如需 SDK 走同一域名，取消注释（否则 SDK 直连 6031）：
    # location /v1/ {
    #     proxy_pass http://127.0.0.1:6031;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # }
    # location ~ ^/(healthz|readyz)$ {
    #     proxy_pass http://127.0.0.1:6031;
    # }

    client_max_body_size 10m;
}

