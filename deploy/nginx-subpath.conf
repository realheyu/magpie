# magpie 管理控制台 —— 本地/测试子路径部署（http://<本机或测试机>/magpie/）
#
# 使用前确认两处前缀一致：
#   1. 本文件的 location /magpie/（换前缀时三处 /magpie 一起改）
#   2. magpie 后端 config.toml 的 server.webBasePath = "/magpie"
#      （或环境变量 MAGPIE_WEB_BASE_PATH=/magpie）
#
# 原理：nginx 把 /magpie/xxx 剥掉前缀后转发 /xxx 给后端（proxy_pass 末尾的斜杠即剥前缀）；
# 后端返回 index.html 时注入 window.__MAGPIE_BASE__ = "/magpie/"，
# 前端路由和 /magpie/api/... 请求都基于该前缀，静态资源则为相对路径，天然兼容。

server {
    listen 80;
    # 本地起可以用 localhost 或内网 IP；和其他服务共用一台 nginx 时保持原有的 server_name 不动
    server_name localhost;

    # 访问 /magpie（无斜杠）时补上斜杠，否则相对路径资源会解析到错误的目录
    location = /magpie {
        return 302 /magpie/;
    }

    # proxy_pass 末尾带斜杠：剥掉 /magpie 前缀再转发
    location /magpie/ {
        proxy_pass http://127.0.0.1:6030/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SDK API（6031 端口上的 /v1/*）默认不走 nginx，SDK 客户端直连 http://<host>:6031。
    # 注意：上面的 location /magpie/ 转发到 6030 管理服务，那里没有注册 /v1 路由，
    # /magpie/v1/... 并不会"自动"转发到 SDK API；确需 SDK 走 nginx（如要 TLS）时启用以下段落：
    # location /magpie/v1/ {
    #     proxy_pass http://127.0.0.1:6031/v1/;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # }

    client_max_body_size 10m;
}
